{% extends "base.html" %}
{% block title %}User Management{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>User Management</h1>
    <p class="sub">Activate or deactivate accounts (SRS 3.1).</p>
  </div>
</div>

<div class="card">
  <div class="table-scroll">
  <table class="data-table">
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.name }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.role_name }}</td>
        <td><span class="badge status-{{ 'New' if u.status=='Active' else 'Overflow' }}">{{ u.status }}</span></td>
        <td>
          <form method="post" action="{{ url_for('toggle_user', user_id=u.user_id) }}">
            <button type="submit" class="btn btn-secondary btn-sm">
              {{ 'Deactivate' if u.status == 'Active' else 'Activate' }}
            </button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  </div>
</div>
{% endblock %}
